<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Fitness and strength zone">
  <defs>
    <linearGradient id="fit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#241a2e"/><stop offset="1" stop-color="#0d0913"/></linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#fit)"/>
  <circle cx="300" cy="170" r="110" fill="#ffb300" opacity=".1"/>
  <!-- barbell -->
  <rect x="90" y="212" width="420" height="14" rx="7" fill="#cbd5e1"/>
  <g fill="#64748b">
    <rect x="70" y="176" width="26" height="86" rx="6"/>
    <rect x="504" y="176" width="26" height="86" rx="6"/>
    <rect x="96" y="188" width="18" height="62" rx="5"/>
    <rect x="486" y="188" width="18" height="62" rx="5"/>
  </g>
  <!-- athlete silhouette -->
