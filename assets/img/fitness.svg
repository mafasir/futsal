    <path d="M26 -48 L52 -20" stroke="#f8fafc" stroke-width="12" stroke-linecap="round"/>
    <path d="M-12 0 L-18 66" stroke="#f8fafc" stroke-width="14" stroke-linecap="round"/>
    <path d="M12 0 L18 66" stroke="#f8fafc" stroke-width="14" stroke-linecap="round"/>
  </g>
  <g fill="#ffb300" opacity=".25">
