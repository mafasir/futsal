<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Futsal coaching session">
  <defs>
    <linearGradient id="bkg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0e2a3d"/><stop offset="1" stop-color="#071420"/></linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bkg)"/>
  <circle cx="300" cy="150" r="95" fill="#00e676" opacity=".12"/>
  <!-- coach -->
  <g transform="translate(300 200)">
    <circle cx="0" cy="-40" r="26" fill="#8d6e63"/>
    <path d="M-30 -10 L30 -10 L36 60 L-36 60 Z" fill="#ffffff" opacity=".92"/>
    <path d="M-30 -8 L-58 26" stroke="#8d6e63" stroke-width="12" stroke-linecap="round"/>
    <path d="M30 -8 L58 26" stroke="#8d6e63" stroke-width="12" stroke-linecap="round"/>
    <path d="M-14 60 L-20 140" stroke="#0b1b2b" stroke-width="15" stroke-linecap="round"/>
    <path d="M14 60 L22 140" stroke="#0b1b2b" stroke-width="15" stroke-linecap="round"/>
  </g>
  <!-- cone -->
  <g transform="translate(120 320)"><path d="M0 0 L18 -46 L36 0 Z" fill="#ff6f00"/><rect x="-6" y="0" width="48" height="10" fill="#e65100"/></g>
  <g transform="translate(490 330)"><path d="M0 0 L18 -46 L36 0 Z" fill="#ff6f00"/><rect x="-6" y="0" width="48" height="10" fill="#e65100"/></g>
  <!-- ball -->
  <g transform="translate(190 350)">
    <circle r="20" fill="#ffffff"/>
    <path d="M0 -20 L9 -10 L0 0 L-9 -10 Z" fill="#111827"/>
    <path d="M0 20 L9 10 L0 0 L-9 10 Z" fill="#111827"/>
    <circle r="20" fill="none" stroke="#0b1b2b" stroke-width="2.5"/>
  </g>
  <!-- clipboard -->
  <g transform="translate(430 250) rotate(-12)">
    <rect x="0" y="0" width="70" height="90" rx="6" fill="#ffffff" opacity=".9"/>
    <rect x="20" y="-8" width="30" height="16" rx="4" fill="#00e676"/>
    <g stroke="#9ca3af" stroke-width="4" stroke-linecap="round">
      <path d="M12 26 H58"/><path d="M12 44 H58"/><path d="M12 62 H44"/>
    </g>
  </g>
</svg>
